name: Build deb package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        submodules: recursive

    - name: Setup iOS SDK
      run: |
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/*.sdk theos/sdks/

    - name: Setup iOS Toolchain
      run: |
        curl -LO https://github.com/theos/toolchain/releases/download/linux-iphone-toolchain-clang-16/iphone-toolchain-linux-amd64-clang-16.tar.xz
        mkdir -p theos/toolchain/linux/iphone
        tar -xf iphone-toolchain-linux-amd64-clang-16.tar.xz -C theos/toolchain/linux/iphone

    - name: Build package
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        export PATH="$THEOS/bin:$PATH"
        make package FINALPACKAGE=1

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: flashlight-daemon
        path: packages/*.deb

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
